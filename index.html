<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Havingood</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101010;
      color: #eeeeee;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 24px;
      border-bottom: 1px solid #303030;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 32px;
      align-items: start;
    }

    .entry {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .card {
      width: 220px;
      height: 96px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #161616;
      border: 1px solid #353535;
      color: #eeeeee;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
    }

    .card:hover,
    .card:focus-visible {
      border-color: #888888;
    }

    .cover-art {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border: 1px solid #353535;
      background: #161616;
    }

    .note {
      padding: 4px 0 4px 20px;
      border-left: 1px solid #353535;
      color: #bbbbbb;
      line-height: 1.6;
    }

    .note p {
      margin: 0;
    }

    @media (max-width: 700px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .note {
        padding: 18px 0 0;
        border-left: 0;
        border-top: 1px solid #353535;
      }
    }

    @media (max-width: 420px) {
      .entry {
        gap: 10px;
      }

      .card {
        width: 180px;
      }

      .cover-art {
        width: 85px;
        height: 95px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Havingood</h1>
  </header>

  <main>
    <div class="layout">
      <section aria-label="Available titles">
        <div class="entry">
          <a
            class="card"
            href="https://trasheap.netlify.app/?rom=PMBlack2.nds"
            target="_blank"
            rel="noopener noreferrer"
          >
            Pokémon Black 2
          </a>

          <img
            class="cover-art"
            src="https://archives.bulbagarden.net/media/upload/3/34/Black_2_EN_boxart.png"
            alt="Pokémon Black Version 2 official cover art"
          >
        </div>
      </section>

      <aside class="note">
        <p>finding unblocked sites sucks so i just made one.</p>
      </aside>
    </div>
  </main>
</body>
</html>
